T_K: 300
tox: 5.0e-9
a0: 2.5e-10
eps_r_TaOx: 25
gap_min: 1.0e-10
gap_max: 1.7e-9
gap_ini_HRS: 1.4e-9
g0_prior_m: 2.75e-10
g0_prior_sigma_m: 0.5e-10
Vel0_prior: 10
Vel0_sigma: 5
beta_prior: 1.25
beta_sigma: 0.5
Rth_prior: 2.1e3
Rth_sigma: 1.0e3
F_min_prior: 1.4e9
# SMU compliance: this device's SET plateau sits at ~0.5 mA. The Stanford
# model has no current limit, so the simulated current is clamped to this.
I_compliance: 5.0e-4
# Series resistance fallback (used only if LRS resistance can't be measured).
series_R_ohm: 1.0e4
# Sweep timing is treated as quasi-static: a tractable nominal rate is used and
# Vel0/Ea (fitted) absorb the effective switching time scale. A literal slow
# (0.1 V/s) sweep is infeasible under the Verilog-A $bound_step(1e-9).
sweep_rate_Vps: 1.0e5
tran_step_s: 1.0e-6
hspice_timeout_s: 60
keep_failed_hspice: 1
# Fisher identifiability report is informational only and costly with the
# polarity-split model; skip it unless explicitly requested.
run_fisher: 0
# Polarity-split fit: SET and RESET branches have independent
# V0/gamma0/Ea/F_min/Vel0/gap_max/gap_ini (suffixes _set/_res); I0,g0,Rs shared.
# Leave active_params unset to use the default split set:
# I0,g0,Rs,V0_set,V0_res,gamma0_set,Ea_set,Ea_res,F_min_set,F_min_res,
#   Vel0_set,Vel0_res,gap_max_set,gap_max_res,gap_ini_set,gap_ini_res
# active_params: I0,g0,Rs,V0_set,V0_res,...
bo_n_init: 48
bo_n_iter: 160
bootstrap_n: 0
rng_seed: 0
hspice_bin: hspice
va_path: ../templates/rram_v_1_0_0_hspice.va
