T_K: 300
tox: 5.0e-9
a0: 2.5e-10
eps_r_TaOx: 25
gap_min: 1.0e-10
gap_max: 1.7e-9
gap_ini_HRS: 1.4e-9
g0_prior_m: 2.75e-10
g0_prior_sigma_m: 0.5e-10
Vel0_prior: 10
Vel0_sigma: 5
beta_prior: 1.25
beta_sigma: 0.5
Rth_prior: 2.1e3
Rth_sigma: 1.0e3
F_min_prior: 1.4e9
# SMU compliance: this device's SET plateau sits at ~0.5 mA. The Stanford
# model has no current limit, so the simulated current is clamped to this.
I_compliance: 5.0e-4
# Series resistance fallback (used only if LRS resistance can't be measured).
series_R_ohm: 1.0e4
# Sweep timing is treated as quasi-static: a tractable nominal rate is used and
# Vel0/Ea (fitted) absorb the effective switching time scale. A literal slow
# (0.1 V/s) sweep is infeasible under the Verilog-A $bound_step(1e-9).
sweep_rate_Vps: 1.0e5
tran_step_s: 1.0e-6
hspice_timeout_s: 60
keep_failed_hspice: 1
# Fisher identifiability report is informational only and costly with the
# polarity-split model; skip it unless explicitly requested.
run_fisher: 1
# Polarity-split fit: SET and RESET branches have independent
# V0/gamma0/Ea/F_min/Vel0/gap_max/gap_ini (suffixes _set/_res); I0,g0,Rs shared.
# Leave active_params unset to use the default split set:
# I0,g0,Rs,V0_set,V0_res,gamma0_set,Ea_set,Ea_res,F_min_set,F_min_res,
#   Vel0_set,Vel0_res,gap_max_set,gap_max_res,gap_ini_set,gap_ini_res
# active_params: I0,g0,Rs,V0_set,V0_res,...
bo_n_init: 48
bo_n_iter: 160
rng_seed: 0
hspice_bin: hspice
va_path: ../templates/rram_v_1_0_0_hspice.va

# --- Conduction-regime physics (02c_classify_conduction_regimes.py) ---
# Path to the <prefix>_regime_map.csv for this device. Empty -> legacy
# hardcoded prior-fit windows and no mechanism-aware loss weighting.
regime_map_csv: ''
# Down-weight residuals in windows whose dominant mechanism the Stanford bulk
# current law cannot represent (Schottky / Fowler-Nordheim).
mechanism_weighting: 1
nonbulk_weight: 0.3

# --- Operational identifiability ---
# Stage 4b profile likelihood: 1-D loss scans around the optimum; the direct
# evidence of practical (non-)identifiability. ~2*n_profile HSPICE sims per
# active parameter -> enable for final/publication runs.
run_profile: 0
n_profile: 7
# Two-pass refit: auto_active=1 + identifiability_csv=<previous run's
# identifiability_report.csv> drops non-identifiable params from the active set.
auto_active: 0
# identifiability_csv: results/S1_taofit/identifiability_report.csv
# freeze_params: comma list of parameters to exclude from optimization
# freeze_params: tox,beta

# --- Ablation hooks (driven by 05_run_ablation.py; leave at defaults here) ---
# prior_mode: physics  -> physics-informed priors (default)
#             plain     -> uninformative priors (sigma=Inf): same model/data/
#                          budget but no physics guidance
prior_mode: physics
# defaults_only: 1 skips Stage 3/4 optimization and returns the prior mean
# (the un-tuned physics initial guess).
defaults_only: 0

# --- Cross-cycle variability (driven by 06_run_variability.py) ---
# Stage 5 LOCO + cluster bootstrap require a per-cycle ensemble CSV passed via
# main_fit's 4th argument (built by 02b_build_cycle_ensemble.py). With only the
# single representative curve these stay off and the CIs remain NaN.
run_loco: 0
run_bootstrap: 0
bootstrap_n: 120          # bootstrap resamples for the 95% parameter CIs
bootstrap_bo_n_init: 8    # reduced BO budget per bootstrap/LOCO refit (speed)
bootstrap_bo_n_iter: 24
loco_bo_n_init: 8
loco_bo_n_iter: 24
