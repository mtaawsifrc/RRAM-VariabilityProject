# Publication ("full and final") configuration.
# Same physics as default_config.yaml, with every reporting stage enabled:
# Fisher CRLB + profile likelihood + mechanism-aware weighting. The per-device
# regime_map_csv (and the ensemble for bootstrap/LOCO CIs) are injected per
# condition by 07_run_final.py / 06_run_variability.py.
T_K: 300
tox: 7.0e-9
a0: 2.5e-10
eps_r_TaOx: 25
gap_min: 1.0e-10
gap_max: 1.7e-9
gap_ini_HRS: 1.4e-9
g0_prior_m: 2.75e-10
g0_prior_sigma_m: 0.5e-10
Vel0_prior: 10
Vel0_sigma: 5
beta_prior: 1.25
beta_sigma: 0.5
Rth_prior: 2.1e3
Rth_sigma: 1.0e3
F_min_prior: 1.4e9
I_compliance: 5.0e-4
series_R_ohm: 1.0e4
sweep_rate_Vps: 1.0e5
tran_step_s: 1.0e-6
hspice_timeout_s: 60
keep_failed_hspice: 1
run_fisher: 1
bo_n_init: 48
bo_n_iter: 160
# Raised from the 100-eval default: archived profile scans found points with
# lower loss than the refined optimum (negative deltas), i.e. Nelder-Mead had
# not converged within 100 evaluations.
refine_max_fun_evals: 300
rng_seed: 0
hspice_bin: hspice
va_path: ../templates/rram_v_1_0_0_hspice.va
prior_mode: physics
defaults_only: 0

# Conduction-regime physics (regime_map_csv injected per condition).
regime_map_csv: ''
mechanism_weighting: 1
nonbulk_weight: 0.3

# Operational identifiability: 1-D loss slice ON for final runs (fixed nuisance,
# not a true profile likelihood).
run_slice: 1
n_slice: 7
auto_active: 0

# Cross-cycle CIs are produced by 06_run_variability.py (needs the ensemble);
# kept off here so the final point-estimate fit stays tractable.
run_loco: 0
run_bootstrap: 0
bootstrap_n: 120
bootstrap_bo_n_init: 8
bootstrap_bo_n_iter: 24
loco_bo_n_init: 8
loco_bo_n_iter: 24
